services:
  openwrt:
    image: openwrt-in-docker:latest
    container_name: openwrt
#    hostname: openwrt
    # Kein privileged: der Entrypoint macht nur einen
    # Dateisync /.etc.pristine -> /etc (s. entrypoint.sh), keinen Mount.
    # NET_ADMIN/NET_RAW für Netzwerkt-Services im Container (iptables, ping, ...).
    # SYSLOG, damit logd /proc/kmsg öffnen kann (sonst startet logd nicht).
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYSLOG
    stop_signal: SIGINT
    # Lifecycle gehört systemd (openwrt.service); Docker darf nicht selbst neu starten,
    # sonst hängt die Netz-Anbindung (openwrt-netattach.service) hinterher.
    restart: "no"
    # Kein Docker-Netz: nur Loopback. Alle Interfaces (lan, wan, wifi-Phy,
    # veth-k3s, veth-mgmt) schiebt openwrt-netattach.service in die Container-Netns.
    # Deshalb auch kein ports:-Mapping mehr.
    network_mode: "none"
    # Für den interaktiven Betrieb im Vordergrund (docker compose up ohne -d).
    # Hinweis: einen Login-Prompt liefert das allein noch nicht, s. unten.
    tty: true
    stdin_open: true
    # RootFS read-only; /etc bleibt über das Volume beschreibbar,
    # Laufzeitpfade bekommen ein tmpfs (OpenWrt erwartet /tmp und /run schreibbar).
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      # Persistente Konfiguration; wird beim ersten Start aus /.etc.pristine
      # befüllt und bei jedem Boot für neuere Image-Dateien aktualisiert.
      # Ausgenommen: config/, dropbear/, board.json, shadow, passwd,
      # rc.local, resolv.conf (bleiben immer Volume-Stand).
      - openwrt-etc:/etc
      - openwrt-overlay:/overlay

volumes:
  openwrt-etc:
  openwrt-overlay:
